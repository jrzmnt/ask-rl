algorithm: PPO

experiment:
  seed: 42
  episodes_eval: 20

  # Method
  regime: rl_only   # rl_only | slm_only | gated

training:
  total_timesteps: 20000000

policy:
  type: MlpPolicy

env:
  name: frozenlake

  regime: frozenlake-4,frozenlake-5,frozenlake-6,frozenlake-7,frozenlake-8

  regimes:
    frozenlake-4:
      id: "FrozenLake-v1"
      size: 4

    frozenlake-5:
      id: "FrozenLake-v1"
      size: 5

    frozenlake-6:
      id: "FrozenLake-v1"
      size: 6

    frozenlake-7:
      id: "FrozenLake-v1"
      size: 7

    frozenlake-8:
      id: "FrozenLake-v1"
      size: 8

slm:
  enabled: false
  model: small

gating:
  type: entropy
  threshold: 0.4

device: auto
